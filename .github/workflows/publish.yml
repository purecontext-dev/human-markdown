name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Create Open VSX namespace (no-op if exists)
        run: npx ovsx create-namespace purecontext -p $OVSX_PAT || true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Publish to Open VSX (Cursor)
        run: npx ovsx publish human-markdown-*.vsix -p $OVSX_PAT
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
